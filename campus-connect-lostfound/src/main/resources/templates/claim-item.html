<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Claim Item</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header>
    <h1>Claim Found Item</h1>
    <nav>
        <a th:href="@{/}">Home</a>
        <a th:href="@{/claim-item}">Claim Item</a>
        <a th:href="@{/matches}">Smart Match</a>
        <a th:href="@{/priority-ranking}">Priority Ranking</a>
        <a th:href="@{/claim-validations}">Claim Validation</a>
    </nav>
</header>

<div class="container">
    <div class="form-box">
        <p class="success" th:if="${successMessage}" th:text="${successMessage}"></p>

        <form th:action="@{/claim-item}" th:object="${claimRequest}" method="post">
            <label>Select Found Item</label>
            <select th:field="*{foundItemId}" required>
                <option value="">Choose an item</option>
                <option th:each="item : ${foundItems}"
                        th:value="${item.id}"
                        th:text="${item.itemName + ' - ' + item.location}">
                </option>
            </select>

            <label>Your Name</label>
            <input type="text" th:field="*{claimantName}" required>

            <label>Your Contact</label>
            <input type="text" th:field="*{claimantContact}" required>

            <label>Proof Details</label>
            <textarea th:field="*{proofDetails}" required></textarea>

            <button type="submit">Submit Claim</button>
        </form>
    </div>
</div>
</body>
</html>
