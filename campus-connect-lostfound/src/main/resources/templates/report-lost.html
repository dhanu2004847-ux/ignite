<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Report Lost Item</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header>
    <h1>Report Lost Item</h1>
    <nav>
        <a th:href="@{/}">Home</a>
        <a th:href="@{/lost-items}">Lost Items</a>
        <a th:href="@{/found-items}">Found Items</a>
        <a th:href="@{/report-lost}">Report Lost</a>
        <a th:href="@{/report-found}">Report Found</a>
        <a th:href="@{/claim-item}">Claim Item</a>
    </nav>
</header>

<div class="container">
    <p class="success" th:text="${successMessage}"></p>
    <form th:action="@{/report-lost}" th:object="${lostItem}" method="post" class="form-box">
        <input type="text" th:field="*{itemName}" placeholder="Item Name" required>
        <input type="text" th:field="*{category}" placeholder="Category" required>
        <textarea th:field="*{description}" placeholder="Description" required></textarea>
        <input type="text" th:field="*{location}" placeholder="Lost Location" required>
        <input type="date" th:field="*{lostDate}" required>
        <input type="text" th:field="*{ownerName}" placeholder="Owner Name" required>
        <input type="text" th:field="*{contactInfo}" placeholder="Contact Info" required>
        <button type="submit">Submit Lost Report</button>
    </form>
</div>
</body>
</html>
